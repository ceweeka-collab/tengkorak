<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raja Tengkorak - Ladang Pembantaian</title>
    <style>
        :root {
            --bg-dark: #0a0806;
            --panel-bg: #16120e;
            --panel-border: #2e2319;
            --accent-gold: #f59e0b;
            --accent-orange: #ea580c;
            --accent-red: #dc2626;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 900px;
            background: radial-gradient(circle at center, #1a120b 0%, #050403 100%);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
            border: 1px solid var(--panel-border);
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .screen.active {
            display: flex;
        }

        /* LOGIN SCREEN */
        #login-screen {
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .brand-logo {
            font-size: 64px;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(234, 88, 12, 0.6));
        }

        .brand-title {
            font-size: 26px;
            font-weight: 900;
            color: var(--accent-orange);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .brand-sub {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 24px;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            text-align: center;
        }

        .input-box:focus {
            border-color: var(--accent-orange);
        }

        /* HEADER / TOP BAR */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(22, 18, 14, 0.95);
            border-bottom: 1px solid var(--panel-border);
            z-index: 10;
        }

        .room-title {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-light);
        }

        .trump-badge {
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.1);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .btn-exit {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* LOBBY SCREEN */
        .lobby-container {
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            margin: 16px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .room-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 14px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* PLAYERS BAR */
        .players-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding: 10px 14px;
        }

        .player-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 8px 4px;
            text-align: center;
        }

        .p-tag {
            font-size: 10px;
            font-weight: 800;
            color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.15);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 4px;
        }

        .p-name {
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ARENA MEJA PERTARUNGAN */
        .arena-container {
            flex: 1;
            margin: 0 14px 10px 14px;
            background: radial-gradient(circle at center, #1a1008 0%, #0d0805 100%);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px 10px;
            position: relative;
            overflow: hidden;
        }

        .arena-header {
            color: var(--accent-orange);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 8px rgba(234, 88, 12, 0.3);
        }

        /* LOGO TENGKORAK TENGAH MEJA */
        .center-skull-watermark {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            opacity: 0.18;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .center-skull-watermark .skull-icon {
            font-size: 85px;
            line-height: 1;
            filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.5));
        }

        .center-skull-watermark .skull-text {
            font-size: 11px;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-gold);
            margin-top: 6px;
        }

        .target-banner {
            background: rgba(10, 8, 6, 0.85);
            border: 1px solid var(--panel-border);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-muted);
            z-index: 2;
        }

        .target-banner span {
            color: var(--accent-gold);
            font-weight: bold;
        }

        /* DESAIN KARTU & LAYOUT KIPAS */
        .cards-hand {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            height: 140px;
            padding-bottom: 10px;
            z-index: 5;
        }

        .card-wrapper {
            margin-left: -22px;
            transition: transform 0.2s ease, filter 0.2s ease;
            cursor: pointer;
        }

        .card-wrapper:first-child {
            margin-left: 0;
        }

        .card-wrapper.selected {
            transform: translateY(-20px) scale(1.06);
            z-index: 50 !important;
        }

        .card-wrapper.selected .card-face {
            border: 2px solid #22c55e;
            box-shadow: 0 0 18px rgba(34, 197, 94, 0.8), 0 10px 20px rgba(0,0,0,0.8);
        }

        .card-face {
            width: 68px;
            height: 102px;
            background: #fdfbf7;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            box-shadow: -2px 4px 10px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 6px;
            position: relative;
            font-family: 'Arial', sans-serif;
            box-sizing: border-box;
        }

        .card-face.red { color: #dc2626; }
        .card-face.black { color: #111827; }

        .card-corner {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 0.85;
            font-weight: 800;
            font-size: 13px;
        }

        .card-corner.bottom {
            align-self: flex-end;
            transform: rotate(180deg);
        }

        .card-center-suit {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
        }

        /* BOTTOM ACTION BAR */
        .bottom-action-bar {
            padding: 10px 14px 28px 14px;
            background: var(--bg-dark);
            border-top: 1px solid var(--panel-border);
            z-index: 10;
        }

        .btn-main {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(234, 88, 12, 0.4);
        }

        .btn-main:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- SCREEN 1: LOGIN -->
    <div id="login-screen" class="screen active">
        <div class="brand-logo">☠️</div>
        <div class="brand-title">RAJA TENGKORAK</div>
        <div class="brand-sub">Ladang Pembantaian Online</div>
        <input type="text" id="username-input" class="input-box" placeholder="Masukkan Username..." maxlength="12">
        <button class="btn-main" onclick="handleLogin()">MASUK LOBBY</button>
    </div>

    <!-- SCREEN 2: LOBBY -->
    <div id="lobby-screen" class="screen">
        <div class="top-bar">
            <div>Player: <span style="color:var(--accent-gold)" id="user-display">User</span></div>
            <button class="btn-exit" onclick="handleLogout()">Logout</button>
        </div>
        <div class="lobby-container">
            <button class="btn-main" onclick="handleCreateRoom()">+ BUAT ROOM BARU</button>
            <div class="room-list" id="room-list"></div>
        </div>
    </div>

    <!-- SCREEN 3: GAME ARENA -->
    <div id="game-screen" class="screen">
        <div class="top-bar">
            <div class="room-title" id="room-name-display">ROOM TENGKORAK ELITE</div>
            <div class="trump-badge">Truf: ♣</div>
            <button class="btn-exit" onclick="handleLeaveRoom()">Keluar</button>
        </div>

        <div class="players-bar">
            <div class="player-box">
                <div class="p-tag">P2</div>
                <div class="p-name" id="p2-name">BotMaster</div>
            </div>
            <div class="player-box">
                <div class="p-tag">P3</div>
                <div class="p-name" id="p3-name">Sultan99</div>
            </div>
            <div class="player-box">
                <div class="p-tag">P4</div>
                <div class="p-name" id="p4-name">Kosong</div>
            </div>
        </div>

        <div class="arena-container">
            <div class="arena-header">MEJA PERTARUNGAN</div>

            <div class="center-skull-watermark">
                <div class="skull-icon">☠️</div>
                <div class="skull-text">RAJA TENGKORAK</div>
            </div>

            <div class="target-banner">
                Target Ronde: <span>Bid: 2 (Truf: ♣)</span>
            </div>

            <div class="cards-hand" id="cards-hand">
                <div class="card-wrapper" onclick="selectCard(this)">
                    <div class="card-face black">
                        <div class="card-corner"><span>10</span><span>♣</span></div>
                        <div class="card-center-suit">♣</div>
                        <div class="card-corner bottom"><span>10</span><span>♣</span></div>
                    </div>
                </div>
                <div class="card-wrapper" onclick="selectCard(this)">
                    <div class="card-face red">
                        <div class="card-corner"><span>J</span><span>♥</span></div>
                        <div class="card-center-suit">♥</div>
                        <div class="card-corner bottom"><span>J</span><span>♥</span></div>
                    </div>
                </div>
                <div class="card-wrapper selected" onclick="selectCard(this)">
                    <div class="card-face red">
                        <div class="card-corner"><span>Q</span><span>♦</span></div>
                        <div class="card-center-suit">♦</div>
                        <div class="card-corner bottom"><span>Q</span><span>♦</span></div>
                    </div>
                </div>
                <div class="card-wrapper" onclick="selectCard(this)">
                    <div class="card-face black">
                        <div class="card-corner"><span>A</span><span>♠</span></div>
                        <div class="card-center-suit">♠</div>
                        <div class="card-corner bottom"><span>A</span><span>♠</span></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-action-bar">
            <button class="btn-main" onclick="handleConfirm()">Konfirmasi Kartu / Target</button>
        </div>
    </div>

</div>

<script>
    // SINTESIS AUDIO BEBAS ERROR (Web Audio API)
    function playClickSound() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.08);
        } catch(e) {}
    }

    let currentUser = localStorage.getItem('rt_user') || '';

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(screenId);
        if(target) target.classList.add('active');
    }

    function handleLogin() {
        playClickSound();
        const input = document.getElementById('username-input').value.trim();
        if(!input) return alert('Masukkan username terlebih dahulu!');
        currentUser = input;
        localStorage.setItem('rt_user', currentUser);
        document.getElementById('user-display').innerText = currentUser;
        showScreen('lobby-screen');
        renderRooms();
    }

    function handleLogout() {
        playClickSound();
        localStorage.clear();
        currentUser = '';
        showScreen('login-screen');
    }

    function renderRooms() {
        const list = document.getElementById('room-list');
        list.innerHTML = `
            <div class="room-card">
                <div>
                    <strong style="color:#fff;">Room Tengkorak Elite</strong>
                    <div style="font-size:12px; color:var(--text-muted);">2/4 Player</div>
                </div>
                <button class="btn-main" style="width:auto; padding:8px 16px; font-size:12px;" onclick="handleJoinRoom('Room Tengkorak Elite')">MASUK</button>
            </div>
        `;
    }

    function handleCreateRoom() {
        playClickSound();
        enterGame('Room ' + currentUser);
    }

    function handleJoinRoom(name) {
        playClickSound();
        enterGame(name);
    }

    function enterGame(roomName) {
        document.getElementById('room-name-display').innerText = roomName.toUpperCase();
        showScreen('game-screen');
    }

    function handleLeaveRoom() {
        playClickSound();
        showScreen('lobby-screen');
    }

    function selectCard(element) {
        playClickSound();
        document.querySelectorAll('.card-wrapper').forEach(c => c.classList.remove('selected'));
        element.classList.add('selected');
    }

    function handleConfirm() {
        playClickSound();
        const selected = document.querySelector('.card-wrapper.selected');
        if(!selected) return alert('Pilih kartumu dulu!');
        alert('Pilihan berhasil dikonfirmasi!');
    }

    window.onload = function() {
        if(currentUser) {
            document.getElementById('user-display').innerText = currentUser;
            showScreen('lobby-screen');
            renderRooms();
        } else {
            showScreen('login-screen');
        }
    };
</script>
</body>
</html>
